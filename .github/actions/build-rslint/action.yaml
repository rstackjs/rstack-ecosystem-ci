name: 'Build Rslint'
description: 'Checkout and build the host Rslint packages'

inputs:
  repository:
    description: 'The rslint repository to use'
    required: true
    default: 'web-infra-dev/rslint'
  ref:
    description: 'The branch, tag or SHA to checkout'
    required: true
    default: 'main'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version-file: .nvmrc

    - name: Install package manager
      shell: bash
      run: |
        npm install -g corepack@latest --force
        corepack enable

    - name: Checkout Rslint repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: ${{ inputs.repository }}
        path: workspace/rslint
        ref: ${{ inputs.ref }}
        submodules: recursive
        persist-credentials: false

    - name: Setup Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version-file: workspace/rslint/go.mod
        cache-dependency-path: |
          workspace/rslint/go.sum
          workspace/rslint/shim/**/go.sum
          workspace/rslint/typescript-go/tsc/go.sum

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      with:
        toolchain: 1.96.1

    - name: Build Rslint
      shell: bash
      working-directory: workspace/rslint
      run: |
        set -euo pipefail
        pnpm install --frozen-lockfile
        pnpm --filter @rslint/native build
        go run ./tools/dump_rule_schemas > packages/rslint/rule-schemas.json
        pnpm --filter @rslint/core... run build

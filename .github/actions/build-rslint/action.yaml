name: 'Build Rslint'
description: 'Checkout, restore Rslint native artifacts, and build JavaScript'

inputs:
  repository:
    description: 'The rslint repository to use'
    required: true
    default: 'web-infra-dev/rslint'
  ref:
    description: 'The branch, tag or SHA to checkout'
    required: true
    default: 'main'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version-file: .nvmrc

    - name: Install package manager
      shell: bash
      run: |
        npm install -g corepack@latest --force
        corepack enable

    - name: Checkout Rslint repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: ${{ inputs.repository }}
        path: workspace/rslint
        ref: ${{ inputs.ref }}
        submodules: recursive
        persist-credentials: false

    - name: Download Rslint native packages and schemas
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: rslint-linux-x64-gnu
        path: workspace/rslint

    - name: Build Rslint JavaScript
      shell: bash
      working-directory: workspace/rslint
      run: |
        set -euo pipefail
        # Artifact downloads do not preserve the Go executable's permission.
        chmod +x npm/rslint/linux-x64-gnu/rslint
        test -s packages/rslint/rule-schemas.json
        pnpm install --frozen-lockfile
        pnpm --filter @rslint/api run build
        pnpm --filter @rslint/core run build:js

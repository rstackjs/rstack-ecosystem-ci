name: 'Prepare Rslint Binding'
description: 'Build and upload the Rslint host native packages and rule schemas'

inputs:
  repository:
    description: 'The rslint repository to use'
    required: true
    default: 'web-infra-dev/rslint'
  ref:
    description: 'The branch, tag or SHA to checkout'
    required: true
    default: 'main'

outputs:
  commit-sha:
    description: 'The source commit used to build the artifacts'
    value: ${{ steps.checkout.outputs.commit }}

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version-file: .nvmrc

    - name: Install package manager
      shell: bash
      run: |
        npm install -g corepack@latest --force
        corepack enable

    - name: Checkout Rslint repo
      id: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: ${{ inputs.repository }}
        path: workspace/rslint
        ref: ${{ inputs.ref }}
        submodules: recursive
        persist-credentials: false

    - name: Setup Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version-file: workspace/rslint/go.mod
        # Keep the build cache within this job; restoring another ref's outputs
        # can exhaust disk space while compiling Rslint.
        cache: false

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      with:
        toolchain: 1.99.0

    - name: Build Rslint native packages
      shell: bash
      working-directory: workspace/rslint
      env:
        # Limit concurrent Go compiler processes to reduce peak disk usage.
        GOFLAGS: -p=4
        # Ubuntu 26.04 mounts /tmp as a quota-limited tmpfs.
        GOTMPDIR: ${{ runner.temp }}/rslint-go
      run: |
        set -euo pipefail
        mkdir -p "$GOTMPDIR"
        source "$GITHUB_ACTION_PATH/diagnostics.sh"
        pnpm install --frozen-lockfile
        rslint_disk_snapshot 'after pnpm install'
        pnpm --filter @rslint/native run build
        rslint_disk_snapshot 'after Rust native build'
        pnpm --filter @rslint/core run build:bin
        rslint_disk_snapshot 'after Go CLI build'
        go run ./tools/dump_rule_schemas > packages/rslint/rule-schemas.json
        rslint_disk_snapshot 'after schema generation'

    - name: Upload Rslint native packages and schemas
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: rslint-linux-x64-gnu
        path: |
          workspace/rslint/npm/rslint/linux-x64-gnu/rslint
          workspace/rslint/npm/rslint/linux-x64-gnu/rslint.linux-x64-gnu.node
          workspace/rslint/packages/rslint/rule-schemas.json
        if-no-files-found: error

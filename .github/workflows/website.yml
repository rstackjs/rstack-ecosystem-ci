name: Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'patches/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.nvmrc'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'patches/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.nvmrc'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build:website
      - name: Type check
        run: pnpm --filter ecosystem-ci-website exec tsc --noEmit
      - name: Validate deployment output
        run: pnpm --filter ecosystem-ci-website deploy:prebuilt --dry-run

name: Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'patches/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.nvmrc'
      - '.github/workflows/cloudflare-workers-deploy.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'patches/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.nvmrc'
      - '.github/workflows/cloudflare-workers-deploy.yml'
  schedule:
    # Hourly from 09:00 to 02:00+1 Beijing (01:00–18:00 UTC)
    - cron: '0 1-18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Fetch history
        run: pnpm --filter ecosystem-ci-website fetch:history
      - name: Verify development SSR and CSS
        working-directory: website
        run: |
          setsid pnpm dev:cached > /tmp/website-dev.log 2>&1 &
          server_pid=$!
          trap 'kill -- "-$server_pid" || true; cat /tmp/website-dev.log' EXIT
          pnpm verify:ssr
      - name: Build
        run: pnpm build:website
      - name: Type check
        run: pnpm --filter ecosystem-ci-website exec tsc --noEmit
      - name: Verify production SSR and CSS
        working-directory: website
        run: |
          setsid pnpm preview --port 5138 > /tmp/website-preview.log 2>&1 &
          server_pid=$!
          trap 'kill -- "-$server_pid" || true; cat /tmp/website-preview.log' EXIT
          pnpm verify:ssr http://localhost:5138
      - name: Validate deployment output
        run: pnpm --filter ecosystem-ci-website deploy:prebuilt --dry-run
      - name: Deploy to Cloudflare Workers
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          pnpm --filter ecosystem-ci-website deploy:prebuilt

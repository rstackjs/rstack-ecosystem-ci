name: cloudflare-workers-deploy

on:
  schedule:
    # Hourly from 09:00 to 02:00+1 Beijing (01:00–18:00 UTC)
    - cron: '0 1-18 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: cloudflare-workers-deploy
  cancel-in-progress: false

jobs:
  trigger:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger Cloudflare Workers Build
        env:
          CLOUDFLARE_WORKERS_DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_WORKERS_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$CLOUDFLARE_WORKERS_DEPLOY_HOOK_URL" ]; then
            echo "Missing secret CLOUDFLARE_WORKERS_DEPLOY_HOOK_URL" >&2
            exit 1
          fi
          curl --fail --silent --show-error --max-time 60 \
            -X POST "$CLOUDFLARE_WORKERS_DEPLOY_HOOK_URL" \
            -o /dev/null -w 'HTTP %{http_code}\n'

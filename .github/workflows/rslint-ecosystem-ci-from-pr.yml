# Integration tests for the rslint ecosystem against a PR branch.
name: rslint-ecosystem-ci-from-pr

env:
  NODE_OPTIONS: --max-old-space-size=6144

on:
  workflow_dispatch:
    inputs:
      prNumber:
        description: 'PR number'
        required: true
        type: string
      branchName:
        description: 'rslint branch to use'
        required: true
        type: string
        default: 'main'
      repo:
        description: 'rslint repository to use'
        required: true
        type: string
        default: 'web-infra-dev/rslint'
      suite:
        description: 'testsuite to run. runs all test suites when `-`.'
        required: false
        type: choice
        options:
          - '-'
          - rsbuild
          - rslib
          - rstest
          - rstack-editor
          - rspress
          - rsdoctor
          - rspack
          - rstack-cli
          - modernjs
          - examples
        default: '-'
      suiteRefType:
        description: 'type of suite ref to use'
        required: true
        type: choice
        options:
          - precoded
          - branch
          - tag
          - commit
        default: 'precoded'
      suiteRef:
        description: 'suite ref to use'
        required: true
        type: string
        default: 'precoded'
      distinct_id:
        description: 'Distinct ID injected by return-dispatch to identify this run'
        required: false
        type: string
        default: ''

jobs:
  return-dispatch-id:
    permissions: {}
    name: Return Dispatch ID
    runs-on: ubuntu-latest
    steps:
      - name: Return Dispatch ID ${{ inputs.distinct_id }}
        run: echo "${DISTINCT_ID}"
        env:
          DISTINCT_ID: ${{ inputs.distinct_id }}

  prepare-binding:
    name: Prepare Rslint Binding
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      commit-sha: ${{ steps.prepare.outputs.commit-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/prepare-rslint-binding
        id: prepare
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.branchName }}

  execute-selected-suite:
    needs: prepare-binding
    if: "inputs.suite != '-'"
    runs-on: ubuntu-latest
    name: execute-all (${{ inputs.suite }})
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/build-rslint
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ needs.prepare-binding.outputs.commit-sha }}
      - run: pnpm install --frozen-lockfile
      - name: Publish Rslint to Verdaccio
        id: publish-rslint
        uses: ./.github/actions/publish-rslint-to-verdaccio
      - name: Run suite (with Verdaccio)
        env:
          NPM_CONFIG_REGISTRY: http://localhost:4873
          RELEASE: ${{ steps.publish-rslint.outputs.version }}
          SUITE: ${{ inputs.suite }}
          SUITE_REF_TYPE: ${{ inputs.suiteRefType }}
          SUITE_REF: ${{ inputs.suiteRef }}
        run: |
          case "$SUITE" in
            rsbuild|rslib|rstest|rstack-editor|rspress|rsdoctor|rspack|rstack-cli|modernjs|examples) ;;
            *) echo "Invalid suite: $SUITE" >&2; exit 1 ;;
          esac
          suite_ref_args=()
          case "$SUITE_REF_TYPE" in
            precoded) ;;
            branch|tag|commit) suite_ref_args=("--suite-$SUITE_REF_TYPE=$SUITE_REF") ;;
            *) echo "Invalid suite ref type: $SUITE_REF_TYPE" >&2; exit 1 ;;
          esac
          pnpm tsx ecosystem-ci.ts run-suites --stack rslint \
            --release "$RELEASE" "${suite_ref_args[@]}" "$SUITE"

  execute-all:
    needs: prepare-binding
    if: "inputs.suite == '-'"
    strategy:
      fail-fast: false
      matrix:
        suite:
          [
            rsbuild,
            rslib,
            rstest,
            rstack-editor,
            rspress,
            rsdoctor,
            rspack,
            rstack-cli,
            modernjs,
            examples,
          ]
    runs-on: ubuntu-latest
    name: execute-all (${{ matrix.suite }})
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/build-rslint
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ needs.prepare-binding.outputs.commit-sha }}
      - run: pnpm install --frozen-lockfile
      - name: Publish Rslint to Verdaccio
        id: publish-rslint
        uses: ./.github/actions/publish-rslint-to-verdaccio
      - name: Run suite (with Verdaccio)
        env:
          NPM_CONFIG_REGISTRY: http://localhost:4873
          RELEASE: ${{ steps.publish-rslint.outputs.version }}
          SUITE: ${{ matrix.suite }}
          SUITE_REF_TYPE: ${{ inputs.suiteRefType }}
          SUITE_REF: ${{ inputs.suiteRef }}
        run: |
          case "$SUITE" in
            rsbuild|rslib|rstest|rstack-editor|rspress|rsdoctor|rspack|rstack-cli|modernjs|examples) ;;
            *) echo "Invalid suite: $SUITE" >&2; exit 1 ;;
          esac
          suite_ref_args=()
          case "$SUITE_REF_TYPE" in
            precoded) ;;
            branch|tag|commit) suite_ref_args=("--suite-$SUITE_REF_TYPE=$SUITE_REF") ;;
            *) echo "Invalid suite ref type: $SUITE_REF_TYPE" >&2; exit 1 ;;
          esac
          pnpm tsx ecosystem-ci.ts run-suites --stack rslint \
            --release "$RELEASE" "${suite_ref_args[@]}" "$SUITE"
permissions:
  contents: read
